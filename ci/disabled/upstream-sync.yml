name: Sync and test upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-updated]
permissions: {}
jobs:
  upstream:
    permissions:
      contents: write
    uses: YOUR-GITHUB-OWNER/dave-fork-ci/.github/workflows/upstream-sync.yml@ddb58394544f30eac7da69ba9ddd16be65d47586
    with:
      tool-repository: YOUR-GITHUB-OWNER/dave-fork-ci
      tool-revision: ddb58394544f30eac7da69ba9ddd16be65d47586
      auto-merge: true
      cache: true
      attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
      attic-cache: ${{ vars.ATTIC_CACHE }}
    secrets:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
