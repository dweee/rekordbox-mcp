name: Sync and test upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-updated]
permissions: {}
jobs:
  upstream:
    permissions:
      contents: write
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@1b4aab97964347d0d84d1592e2845684aea2745a
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: 1b4aab97964347d0d84d1592e2845684aea2745a
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && vars.ATTIC_PUSH_ENABLED == 'true' }}
      cache: ${{ vars.ATTIC_PUSH_ENABLED == 'true' }}
      attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
      attic-cache: ${{ vars.ATTIC_CACHE }}
    secrets:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
