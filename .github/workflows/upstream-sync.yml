name: Sync and test upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-updated]
permissions: {}
jobs:
  upstream:
    # The pinned controller keeps fork control files and checks public closures before build and export.
    if: ${{ vars.GUARDED_UPSTREAM_SYNC_ENABLED == 'true' }}
    permissions:
      statuses: write
      id-token: write
      contents: write
      actions: write
      checks: read
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@02d38fe80b2fecb41503a90943fd04000174b955
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: 02d38fe80b2fecb41503a90943fd04000174b955
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && vars.ATTIC_PUSH_ENABLED == 'true' }}
      cache: false
