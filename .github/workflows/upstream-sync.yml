name: Sync and test upstream
'on':
  schedule:
  - cron: 17 */6 * * *
  workflow_dispatch: null
  repository_dispatch:
    types:
    - upstream-updated
permissions: {}
jobs:
  upstream:
    if: ${{ vars.GUARDED_UPSTREAM_SYNC_ENABLED == 'true' }}
    permissions:
      statuses: write
      id-token: write
      contents: write
      actions: write
      checks: read
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@753d456d912f24b95126107b953e1ddf15536e8b
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: 753d456d912f24b95126107b953e1ddf15536e8b
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && (vars.NIKS3_PUSH_ENABLED || vars.ATTIC_PUSH_ENABLED) == 'true' }}
      cache: false
