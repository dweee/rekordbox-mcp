name: Sync and test upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-updated]
permissions: {}
jobs:
  upstream:
    permissions:
      contents: write
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@b5ad6e59b40ac1602172981bd28109c61798709f
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: b5ad6e59b40ac1602172981bd28109c61798709f
      auto-merge: false
      cache: ${{ vars.ATTIC_PUSH_ENABLED == 'true' }}
      attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
      attic-cache: ${{ vars.ATTIC_CACHE }}
    secrets:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
