name: Preserve package backups
on:
  workflow_run:
    workflows: ["rekordbox-mcp darwin", "Sync and test upstream"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Workflow run containing package artifacts to preserve
        required: true
        type: string
permissions: {}
jobs:
  archive:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    permissions:
      contents: write
      actions: write
    uses: dweee/dave-fork-ci/.github/workflows/archive-packages.yml@c27946a8b0359e236b9ba8ebb279313abd63bc45
    with:
      run-id: ${{ format('{0}', github.event.workflow_run.id || inputs.run-id) }}
      tool-revision: c27946a8b0359e236b9ba8ebb279313abd63bc45
